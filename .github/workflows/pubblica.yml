# Pubblica su Instagram un post del ramo "anteprime" (pubblica.py).
# - alle 18:30 di Roma (17:30 UTC; d'estate le 19:30) dal lunedi' al venerdi':
#   pubblica il post di oggi SOLO se Gigi lo ha approvato (file approvato.json
#   nella sua cartella, scritto da Claude dopo l'ok in chat);
# - a mano: pubblica subito la cartella indicata (lanciarlo a mano vale come ok).
# Serve il segreto IG_TOKEN (token dell'account Instagram, lo inserisce Gigi).
name: Pubblica su Instagram

on:
  schedule:
    - cron: '30 17 * * 1-5'
  workflow_dispatch:
    inputs:
      cartella:
        description: "Cartella del post nel ramo anteprime (vuoto = quella di oggi)"
        default: ''

permissions:
  contents: write

concurrency:
  group: anteprime
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: codice
      - uses: actions/checkout@v4
        with:
          ref: anteprime
          path: anteprime
      - name: Scegli la cartella
        id: c
        env:
          CARTELLA: ${{ inputs.cartella }}
          EVENTO: ${{ github.event_name }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          cd anteprime
          OGGI=$(TZ=Europe/Rome date +%F)
          if [ "$EVENTO" = "schedule" ]; then
            if [ -z "$IG_TOKEN" ]; then echo "::warning::IG_TOKEN non ancora inserito: niente pubblicazione"; exit 0; fi
            for d in "$OGGI"-*/; do
              d=${d%/}
              [ -f "$d/approvato.json" ] && [ ! -f "$d/pubblicato.json" ] && CARTELLA=$d && break
            done
            if [ -z "$CARTELLA" ]; then echo "Nessun post approvato da pubblicare oggi"; exit 0; fi
          elif [ -z "$CARTELLA" ]; then
            CARTELLA=$(ls -d "$OGGI"-*/ 2>/dev/null | grep -v PROVA | head -1 | tr -d /)
          fi
          if [ -z "$CARTELLA" ] || [ ! -d "$CARTELLA" ]; then
            echo "::error::Nessun post da pubblicare (${CARTELLA:-oggi})"; exit 1
          fi
          echo "cartella=$CARTELLA" >> "$GITHUB_OUTPUT"
      - name: Pubblica
        if: steps.c.outputs.cartella != ''
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 codice/pubblica.py "anteprime/${{ steps.c.outputs.cartella }}"
      - name: Segna come pubblicato
        if: always() && steps.c.outputs.cartella != ''
        run: |
          cd anteprime
          [ -f "${{ steps.c.outputs.cartella }}/pubblicato.json" ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Pubblicato ${{ steps.c.outputs.cartella }}" || exit 0
          for i in 1 2 3; do git push -q origin HEAD:anteprime && break; git pull -q --rebase origin anteprime; done
